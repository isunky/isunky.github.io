<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mobile viewport capture</title>
	<style>html,body{width:390px;height:844px;margin:0;overflow:hidden}iframe{display:block;width:390px;height:844px;border:0}</style>
</head>
<body>
	<iframe title="390 px responsive viewport"></iframe>
	<script>
		const page = new URLSearchParams(location.search).get('page') || 'preview.html';
		document.querySelector('iframe').src = '../wp-content/themes/sunky-studio/' + page;
	</script>
</body>
</html>
